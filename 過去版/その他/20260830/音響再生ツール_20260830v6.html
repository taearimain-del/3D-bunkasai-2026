<style>
:root{
  --bg:#05101f; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.08); --panel3:rgba(255,255,255,.13);
  --border:rgba(176,210,240,.16); --border-strong:rgba(176,210,240,.34);
  --text:#e9f2fb; --sub:#93a8bd;
  --accent:#cfe7ff; --accent-hover:#e3f2ff; --accent-ink:#0a1626;
  --good:#8fe3c9; --warn:#e8c17a; --danger:#f0897e;
  --serif:'Hiragino Mincho ProN','Yu Mincho','YuMincho','Shippori Mincho',serif;
}
*{box-sizing:border-box;}
body{
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',-apple-system,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(120% 80% at 50% -8%, rgba(90,160,220,.22), transparent 55%),
    linear-gradient(180deg,#050f1e 0%,#071a30 40%,#08243c 72%,#0a2b44 100%);
  background-attachment:fixed;
  color:var(--text); margin:0; padding:20px 20px 132px;
  -webkit-font-smoothing:antialiased;
  letter-spacing:.01em;
}
h1{font-family:var(--serif); font-size:1.6rem; font-weight:600; letter-spacing:.06em; margin:0 0 22px; color:#f2f8ff;}
.toolbar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:12px 14px; margin-bottom:18px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
}
.toolbar input[type=file]{color:var(--sub); font-size:0.8rem;}
button{
  font-family:inherit; cursor:pointer; border-radius:20px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); padding:8px 14px; font-size:0.85rem;
  white-space:nowrap; flex:0 0 auto;
  transition:transform .12s ease, background-color .12s ease, filter .12s ease, color .12s ease;
}
button:hover{background:var(--panel3);}
button:active{transform:scale(.96);}
button.play{
  background:rgba(207,231,255,.09);
  color:#f5faff; border:1.5px solid rgba(207,231,255,.75); font-weight:700;
  box-shadow:0 0 0 1px rgba(207,231,255,.1) inset, 0 0 16px rgba(207,231,255,.4), 0 0 2px rgba(207,231,255,.8);
}
button.play:hover{
  background:rgba(207,231,255,.16);
  border-color:#eaf4ff;
  box-shadow:0 0 0 1px rgba(255,255,255,.14) inset, 0 0 28px rgba(207,231,255,.65), 0 0 3px rgba(227,242,255,.9);
}
button.stop{background:transparent; color:var(--sub); border-color:var(--border);}
button.stop:hover{color:var(--danger); border-color:var(--danger); background:var(--panel2);}
button.fadebtn{background:transparent; color:var(--sub); border-color:var(--border);}
button.fadebtn:hover{color:var(--warn); border-color:var(--warn); background:var(--panel2);}
button:disabled{opacity:.32; cursor:not-allowed; transform:none;}
section{margin-bottom:22px;}
section h2{
  font-family:var(--serif); font-size:1.08rem; font-weight:600; letter-spacing:.08em;
  padding-bottom:9px; margin:34px 0 14px; color:#eaf4ff; position:relative;
}
section h2::after{
  content:""; position:absolute; left:0; bottom:0; width:100%; height:1px;
  background:linear-gradient(90deg, var(--border-strong), transparent 70%);
}
.cue{
  display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:8px 10px; margin-bottom:6px;
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:background-color .18s ease, border-color .18s ease, transform .18s ease;
}
.cue:hover{background:var(--panel2); transform:translateY(-1px);}
.cue.current{background:rgba(207,231,255,.09); border-color:var(--border-strong); box-shadow:0 8px 22px rgba(10,40,70,.35), inset 0 1px 0 rgba(255,255,255,.08);}
.cue.playing{animation:cueBreathe 2.6s ease-in-out infinite;}
@keyframes cueBreathe{
  0%,100%{box-shadow:0 8px 22px rgba(10,40,70,.35), inset 0 1px 0 rgba(255,255,255,.08), 0 0 0 rgba(207,231,255,0);}
  50%{box-shadow:0 8px 26px rgba(10,40,70,.4), inset 0 1px 0 rgba(255,255,255,.1), 0 0 22px rgba(207,231,255,.28);}
}
@media (prefers-reduced-motion: reduce){
  .cue.playing{animation:none; box-shadow:0 8px 24px rgba(10,40,70,.38), inset 0 1px 0 rgba(255,255,255,.09), 0 0 14px rgba(207,231,255,.2);}
}
.dot{width:10px; height:10px; border-radius:50%; background:#555; flex:0 0 auto;}
.dot.loaded{background:var(--good); box-shadow:0 0 6px rgba(143,227,201,.6);}
.dot.error{background:var(--danger); box-shadow:0 0 6px rgba(240,137,126,.6);}
.num{color:var(--sub); font-size:0.75rem; flex:0 0 auto; width:32px; height:16px; text-align:center; position:relative;}
.num .idnum{display:block;}
.num .eq{display:none; align-items:flex-end; justify-content:center; gap:2px; height:14px;}
.cue.current .num .idnum{display:none;}
.cue.current .num .eq{display:flex;}
.num .eq i{width:3px; background:var(--accent); border-radius:1px; height:4px; animation:eqBounce 0.9s ease-in-out infinite; animation-play-state:paused;}
.cue.playing .num .eq i{animation-play-state:running;}
.num .eq i:nth-child(1){animation-delay:-0.6s;}
.num .eq i:nth-child(2){animation-delay:-0.3s;}
.num .eq i:nth-child(3){animation-delay:0s;}
@keyframes eqBounce{
  0%,100%{height:4px;}
  50%{height:14px;}
}
.meta{flex:1 1 auto; min-width:0;}
.meta b{display:block; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cue.current .meta b{color:var(--accent);}
.meta .timing{color:var(--sub); font-size:0.74rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.meta .note{color:var(--warn); font-size:0.72rem; margin-top:1px; line-height:1.3;}
.meta .filename{color:var(--sub); font-size:0.68rem; margin-top:1px; display:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ctrl{display:flex; gap:6px; flex:0 0 auto;}
.iconbtn{
  width:44px; height:44px; min-width:44px; min-height:44px; padding:0; font-size:1.1rem;
  display:flex; align-items:center; justify-content:center; border-radius:50%;
  background:linear-gradient(160deg, rgba(255,255,255,.20), rgba(255,255,255,.05) 55%, rgba(207,231,255,.10));
  border:1.5px solid rgba(207,231,255,.65);
  backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 -8px 12px rgba(0,0,0,.18) inset, 0 0 14px rgba(207,231,255,.35);
}
.iconbtn:hover{
  transform:scale(1.08);
  background:linear-gradient(160deg, rgba(255,255,255,.30), rgba(255,255,255,.08) 55%, rgba(207,231,255,.16));
  border-color:rgba(227,242,255,.95);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 -8px 12px rgba(0,0,0,.14) inset, 0 0 24px rgba(207,231,255,.6);
}
.filebtn{position:relative; overflow:hidden;}
.filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.nowplaying{
  position:fixed; left:0; right:0; bottom:0;
  background:rgba(6,16,30,.86); border-top:1px solid var(--border-strong);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  box-shadow:0 -12px 30px rgba(0,0,0,.4);
}
.nowplaying .np-info{flex:1 1 160px; min-width:120px; max-width:240px;}
.nowplaying .label{font-size:0.68rem; color:var(--sub); text-transform:uppercase; letter-spacing:.04em;}
.nowplaying .title{font-family:var(--serif); font-size:1rem; font-weight:600; color:#f2f8ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.np-center{flex:2 1 320px; min-width:260px; display:flex; flex-direction:column; align-items:center; gap:6px;}
.np-buttons{display:flex; gap:10px; align-items:center; justify-content:center;}
.np-buttons .iconbtn.play{width:48px; height:48px; min-width:48px; min-height:48px; font-size:1.2rem;}
.np-seekrow{display:flex; align-items:center; gap:8px; width:100%; max-width:520px;}
.np-time{font-size:0.72rem; color:var(--sub); min-width:38px; text-align:center; flex:0 0 auto;}
.np-right{flex:0 0 auto; display:flex; align-items:center; gap:6px; margin-left:auto;}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:6px;
  border-radius:4px; background:var(--panel2); outline:none; cursor:pointer;
}
input[type=range]:disabled{cursor:not-allowed; opacity:.6;}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:13px; height:13px; border-radius:50%;
  background:var(--accent); cursor:pointer; border:0;
}
input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%; background:var(--accent);
  cursor:pointer; border:0;
}
.kbd{font-size:0.72rem; color:var(--sub); margin-left:auto;}
kbd{background:var(--panel2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:0.72rem;}
@media (max-width:640px){
  body{padding:14px 12px 190px;}
  h1{font-size:1.25rem;}
  .toolbar{padding:10px 12px; gap:8px;}
  .cue{flex-wrap:nowrap; gap:8px; padding:8px;}
  .num{width:26px;}
  .ctrl{gap:4px;}
  .meta .timing{font-size:0.78rem;}
  .meta .note{font-size:0.76rem;}
  .meta .filename{font-size:0.72rem;}
  kbd, .kbd{font-size:0.76rem;}
  .np-time{font-size:0.76rem; min-width:34px;}
  .nowplaying .label{font-size:0.72rem;}
  /* 縦積み(column)にすると、行方向(width)用に設定していたflex-basis(160px/320px)が
     そのまま高さの基準値として解釈されてしまい、バーが異常に縦長になるバグがあった。
     column方向の子要素はすべてflex:0 0 auto（伸縮なし・中身の高さのみ）に固定し、
     gapも縦積み用に詰める。 */
  .nowplaying{flex-direction:column; align-items:stretch; padding:8px 12px; gap:6px;}
  .nowplaying .np-info{flex:0 0 auto; max-width:none; min-width:0; text-align:center;}
  .np-center{flex:0 0 auto; min-width:0; gap:4px;}
  .np-buttons{flex:0 0 auto; gap:8px;}
  .np-seekrow{flex:0 0 auto;}
  .np-right{flex:0 0 auto; margin-left:0; justify-content:center;}
}
@media (max-width:400px){
  body{padding:12px 8px 200px;}
  .toolbar{padding:8px 10px;}
  .cue{padding:7px 6px; gap:6px;}
  .meta b{font-size:0.86rem;}
  .iconbtn{font-size:1rem;}
}
/* --- 統合タイムライン（2026-08-30追加）---
   song/narr/se の各キューを実際の上演順に1本の通し一覧として表示するための
   ACT区切り線・種類バッジ（歌唱／ナレーション／SE）のスタイル。 */
.act-divider{
  display:flex; align-items:center; gap:10px;
  margin:30px 0 12px; color:var(--sub);
  font-family:var(--serif); font-size:0.78rem; font-weight:600;
  letter-spacing:.16em;
}
.act-divider::before, .act-divider::after{
  content:""; flex:1 1 auto; height:1px;
  background:linear-gradient(90deg, transparent, var(--border-strong) 50%, transparent);
}
.act-divider span{flex:0 0 auto; white-space:nowrap; padding:0 2px;}
.type-badge{
  display:inline-block; font-size:0.62rem; font-weight:700; letter-spacing:.02em;
  padding:1px 6px; border-radius:8px; margin-right:6px; vertical-align:middle;
  white-space:nowrap;
}
.type-badge.badge-song{background:rgba(207,231,255,.16); color:var(--accent); border:1px solid rgba(207,231,255,.4);}
.type-badge.badge-narr{background:rgba(232,193,122,.16); color:var(--warn); border:1px solid rgba(232,193,122,.4);}
.type-badge.badge-se{background:rgba(240,137,126,.16); color:var(--danger); border:1px solid rgba(240,137,126,.4);}
@media (max-width:640px){
  .act-divider{font-size:0.72rem; margin:24px 0 10px;}
  .type-badge{font-size:0.58rem;}
}
</style>

<h1>🔊 音響キュー再生ツール</h1>

<div class="toolbar">
  <span class="kbd">全停止：<kbd>Esc</kbd></span>
</div>

<section id="sec-timeline">
  <h2>本番タイムライン</h2>
</section>

<div class="nowplaying">
  <div class="np-info">
    <div class="label">現在再生中</div>
    <div class="title" id="npTitle">停止中</div>
  </div>
  <div class="np-center">
    <div class="np-buttons">
      <button class="iconbtn" id="npBack" title="10秒戻る" aria-label="10秒戻る">⏪</button>
      <button class="iconbtn play" id="npPlayPause" title="再生" aria-label="再生" disabled>▶</button>
      <button class="iconbtn" id="npFwd" title="10秒進む" aria-label="10秒進む">⏩</button>
    </div>
    <div class="np-seekrow">
      <span class="np-time" id="npTimeCur">00:00</span>
      <input type="range" id="npSeek" min="0" max="1000" value="0" step="1" disabled>
      <span class="np-time" id="npTimeDur">00:00</span>
    </div>
  </div>
  <div class="np-right">
    <button class="iconbtn fadebtn" id="npFade" title="フェードアウト（5秒）" aria-label="フェードアウト（5秒）" disabled>🔉</button>
    <button class="iconbtn stop" id="npStop" title="全停止（緊急停止）" aria-label="全停止（緊急停止）">■</button>
  </div>
</div>

// 効果音(SE)は他の音と重ねて再生できるため、「現在再生中」は単一IDではなく集合で管理する。
// activeIds: 現在アクティブ（再生中／一時停止中を含む）なキューIDの集合。SEは複数同時に含まれ得る。
// currentId: 下部固定バー（曲名・シークバー等）に表示する対象。最後に再生を開始したキューを指す。
const activeIds = new Set();
let currentId = null;

// --- Web Audio API（GainNode）による音量制御 ---
// iOS Safariには「JavaScriptから<audio>要素の.volumeプロパティを変更しても
// 実際の再生音量には反映されない」という既知の仕様上の制限があるため（音量は
// 物理ボタン／サイレントスイッチのみで制御される）、フェードアウト等の音量操作は
// audio.volumeではなくWeb Audio APIのGainNodeを介して行う。AudioContextは
// ユーザー操作（ボタンタップ）をきっかけに生成・resumeする（iOSはジェスチャー
// なしでのAudioContext起動を許可しないため）。
let audioCtx = null;
function getAudioContext(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return null; // 非対応環境ではnullを返し、呼び出し側でaudio.volumeにフォールバックさせる
  if(!audioCtx){
    try{ audioCtx = new AC(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

// 各キューにつきMediaElementAudioSourceNode／GainNodeのペアを1つだけ作成し、
// 以後は使い回す（createMediaElementSourceは同一<audio>要素に対して一度しか呼べない）。
function ensureGainNode(id){
  const st = state[id];
  if(!st) return null;
  if(st.gainNode) return st.gainNode;
  const ctx = getAudioContext();
  if(!ctx) return null;
  try{
    const source = ctx.createMediaElementSource(st.audio);
    const gain = ctx.createGain();
    gain.gain.value = 1;
    source.connect(gain).connect(ctx.destination);
    st.sourceNode = source;
    st.gainNode = gain;
  }catch(e){
    st.gainNode = null; // 生成に失敗した場合はaudio.volumeベースにフォールバック
  }
  return st.gainNode;
}

// フェード等で変化させた音量を1（フル音量）に戻す。GainNodeがあればそちらを、
// 無ければ従来どおりaudio.volumeを使う（両方セットしても無害）。
function resetVolume(id){
  const st = state[id];
  if(!st) return;
  st.audio.volume = 1;
  if(st.gainNode && audioCtx){
    const now = audioCtx.currentTime;
    st.gainNode.gain.cancelScheduledValues(now);
    st.gainNode.gain.setValueAtTime(1, now);
  }
}

function fmtTime(s){
  if(!isFinite(s)) return '00:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// --- 統合タイムライン（2026-08-30追加）---
// song/narr/se の各キューを、台本本文・ACT進行順に基づく実際の上演順に並べたID一覧。
// 各キューが元々どの種類（song/narr/se）だったかは cueCategory() で判定しバッジ表示する。
// extra（X2・X3）は用途未確定のためこのタイムラインには含めない（ユーザー指示、UI非表示のみ。
// データはCUES.extraにそのまま保持）。
// 並び順の根拠：other/台本/台本_アナと雪の女王.md本文を実際に読み、各SE・ナレーションが
// 台詞・歌のどの位置に挿入されるかを確認して確定した（2026-08-30）。
const TIMELINE_ORDER = [
  {id:'00', actGroup:'開演前'},
  {id:'N1', actGroup:'ACT1'},
  {id:'SE1', actGroup:'ACT1'},
  {id:'01', actGroup:'ACT1'},
  {id:'N2', actGroup:'ACT2'},
  {id:'02', actGroup:'ACT2'},
  {id:'03', actGroup:'ACT2'},
  {id:'SE2', actGroup:'ACT3'},
  {id:'SE3', actGroup:'ACT3'},
  {id:'04', actGroup:'ACT3'},
  {id:'04k1', actGroup:'ACT3'},
  {id:'04k2', actGroup:'ACT3'},
  {id:'SE4', actGroup:'ACT3'},
  {id:'05', actGroup:'ACT4'},
  {id:'N3', actGroup:'ACT5'},
  {id:'06', actGroup:'ACT5'},
  {id:'SE5', actGroup:'ACT5'},
  {id:'07', actGroup:'ACT5'},
  {id:'SE6', actGroup:'ACT7'},
  {id:'SE7', actGroup:'ACT7'},
  {id:'08', actGroup:'フィナーレ'},
];

function typeBadge(cat){
  if(cat === 'song') return {label:'🎵 歌・BGM', cls:'badge-song'};
  if(cat === 'narr') return {label:'🎙 ナレーション', cls:'badge-narr'};
  if(cat === 'se') return {label:'🔊 SE', cls:'badge-se'};
  return null;
}

function buildTimelineRow(containerEl, cue){
  const badge = typeBadge(cueCategory(cue.id));
  const badgeHtml = badge ? `<span class="type-badge ${badge.cls}">${badge.label}</span>` : '';
  // 2026-08-30再改訂：cue.file／cue.dataのどちらか一方でも存在するキューは、
  // ページ読込時からボタンを有効にする（実際のロードはtogglePlay内で初回クリック時に
  // 同期的に行う。iOS SafariではcanplaythroughイベントがユーザーOKしないと発火せず
  // ボタンが永久disabledのままになるバグがあったため）。
  // 音源が真に未登録（file・dataどちらも無い）なプレースホルダ（N1〜N3・SE2・SE4）だけ
  // 従来通りdisabledのままにし、📂ローカルファイル選択を促す。
  const hasSource = !!(cue.file || cue.data);
  const row = document.createElement('div');
  row.className = 'cue';
  row.id = 'row-'+cue.id;
  row.innerHTML = `
    <div class="dot" id="dot-${cue.id}"></div>
    <div class="num">
      <span class="idnum">${cue.id}</span>
      <span class="eq"><i></i><i></i><i></i></span>
    </div>
    <div class="meta">
      <b>${badgeHtml}${cue.name}</b>
      <div class="timing">${cue.act} ／ ${cue.dur}</div>
      ${cue.note ? `<div class="note">${cue.note}</div>` : ''}
      <div class="filename" id="filename-${cue.id}"></div>
    </div>
    <div class="ctrl">
      <button class="iconbtn filebtn" title="ファイル選択" aria-label="ファイル選択">📂<input type="file" accept="audio/*" data-id="${cue.id}" class="fileInput"></button>
      <button class="iconbtn play" data-id="${cue.id}" ${hasSource ? '' : 'disabled'} title="再生" aria-label="再生">▶</button>
    </div>
  `;
  containerEl.appendChild(row);
}

function buildTimeline(containerEl, order){
  let prevAct = null;
  order.forEach(entry => {
    const cue = allCues().find(c => c.id === entry.id);
    if(!cue) return; // 未登録のIDは防御的にスキップ
    if(entry.actGroup !== prevAct){
      const divider = document.createElement('div');
      divider.className = 'act-divider';
      divider.innerHTML = `<span>${entry.actGroup}</span>`;
      containerEl.appendChild(divider);
      prevAct = entry.actGroup;
    }
    buildTimelineRow(containerEl, cue);
  });
}

buildTimeline(document.getElementById('sec-timeline'), TIMELINE_ORDER);

function allCues(){
  return [...CUES.song, ...CUES.narr, ...CUES.se, ...CUES.extra];
}

// キューIDがどのカテゴリ（song/narr/se/extra）に属するかを返す。
// SE（効果音）だけ「重ねて再生してもよい」特別扱いにするための判定に使う。
function cueCategory(id){
  for(const cat of ['song','narr','se','extra']){
    if(CUES[cat].some(c => c.id === id)) return cat;
  }
  return null;
}
function isSeCue(id){
  return cueCategory(id) === 'se';
}

function markLoaded(id, label){
  // 2026-08-30：統合タイムライン化に伴い、extra（X2・X3）はUI行が存在しなくなった。
  // 該当するdot要素が無い場合（＝タイムライン非表示のキュー）は何もせず抜ける防御的処理。
  const dotEl = document.getElementById('dot-'+id);
  if(!dotEl) return;
  dotEl.classList.add('loaded');
  const fnEl = document.getElementById('filename-'+id);
  fnEl.textContent = '読み込み済み: ' + label;
  fnEl.style.display = 'block';
  document.querySelectorAll(`button[data-id="${id}"]`).forEach(b => b.disabled = false);
}

function wireAudioEvents(id, audio){
  audio.addEventListener('timeupdate', () => { if(currentId===id) updateNowPlaying(); });
  audio.addEventListener('ended', () => {
    // 自然終了したキュー自身だけを非アクティブ化する（他に同時再生中の音があっても止めない）
    deactivateCue(id);
    refreshRowStates();
    updateNowPlaying();
  });
}

function assignFile(id, file){
  const cue = allCues().find(c => c.id === id);
  if(!cue) return;
  if(state[id] && state[id].objectUrl) URL.revokeObjectURL(state[id].objectUrl);
  const url = URL.createObjectURL(file);
  const audio = new Audio(url);
  audio.preload = 'auto';
  state[id] = {audio, objectUrl:url, fileName:file.name};
  markLoaded(id, file.name);
  wireAudioEvents(id, audio);
}

// dot要素を「読み込み失敗」表示に切り替え、再生ボタンを再度disabledに戻す。
// canplaythrough待ちをやめ即座にロード扱いにする代わりに、事後のerrorイベントで
// 読み込み失敗を検知するための保険（2026-08-30再改訂）。
function markLoadError(id, label){
  const dotEl = document.getElementById('dot-'+id);
  if(dotEl){ dotEl.classList.remove('loaded'); dotEl.classList.add('error'); }
  const fnEl = document.getElementById('filename-'+id);
  if(fnEl){ fnEl.textContent = '読み込み失敗: ' + label; fnEl.style.display = 'block'; }
  document.querySelectorAll(`button[data-id="${id}"]`).forEach(b => b.disabled = true);
}

// キューを即座に（同期的に）ロードする共通関数（2026-08-30再改訂：iOS Safari対応）。
// 従来はcue.fileの場合、canplaythroughイベントの発火を待ってからmarkLoaded()する設計
// だったが、iOS Safariはユーザー操作を伴わない自動プリロードを厳しく制限しており、
// ページ読込時にcanplaythroughが発火せず再生ボタンが永久disabledのままになる不具合が
// あった。全ファイル参照はSHA-256で実ファイルとの整合性を検証済み（2026-08-30）で
// 現時点で存在しないファイルを参照しているキューは無いため、事前のcanplaythrough確認は
// 行わず、Audio要素を生成した時点で即「読み込み済み」として扱う。万一実際には読み込めない
// 場合は、生成したAudio要素のerrorイベントで事後的に検知しmarkLoadError()に切り替える。
// tryAutoLoad（ページ読込時の先読み・自動有効化）とtogglePlay（クリック時の遅延ロード）の
// 両方から共通で呼ばれる。
function loadCue(cue){
  if(state[cue.id]) return state[cue.id];
  let audio, fileName, loadedLabel;
  if(cue.data){
    // HTMLファイルに埋め込み済みの音源。ファイル読込不要で即再生可能。
    audio = new Audio(cue.data);
    fileName = cue.file || '埋め込み音源';
    loadedLabel = fileName + '（内蔵済み）';
  } else if(cue.file){
    audio = new Audio(encodeURI(cue.file));
    fileName = cue.file;
    loadedLabel = fileName + '（自動読込）';
  } else {
    return null; // file・dataどちらも無い真の未登録プレースホルダ
  }
  audio.preload = 'auto';
  state[cue.id] = {audio, objectUrl:null, fileName};
  markLoaded(cue.id, loadedLabel);
  wireAudioEvents(cue.id, audio);
  audio.addEventListener('error', () => markLoadError(cue.id, fileName));
  return state[cue.id];
}

// ページ読込時、全キューを即座にロード・有効化する「先読み」処理。
// 実処理はloadCue()に委譲（ロード方式自体はloadCueのコメント参照）。
function tryAutoLoad(cue){
  loadCue(cue);
}

allCues().forEach(tryAutoLoad);

document.querySelectorAll('.fileInput').forEach(inp => {
  inp.addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) assignFile(inp.dataset.id, f);
  });
});

function refreshRowStates(){
  document.querySelectorAll('.cue').forEach(r => r.classList.remove('current', 'playing'));
  activeIds.forEach(id => {
    const row = document.getElementById('row-'+id);
    if(row){
      row.classList.add('current');
      const st = state[id];
      if(st && !st.audio.paused) row.classList.add('playing');
    }
  });
  updateAllPlayIcons();
}

function updatePlayIcon(id){
  const btn = document.querySelector(`.iconbtn.play[data-id="${id}"]`);
  if(!btn) return;
  const st = state[id];
  // 各キューのAudio要素は独立して再生状態(paused)を持つため、SEが複数同時再生されていても
  // 行ごとのアイコンはそのキュー自身の実際の再生状態を正しく反映する。
  const playing = !!(st && activeIds.has(id) && !st.audio.paused);
  btn.textContent = playing ? '⏸' : '▶';
  btn.title = playing ? '一時停止' : '再生';
  btn.setAttribute('aria-label', btn.title);
}

function updateAllPlayIcons(){
  allCues().forEach(c => updatePlayIcon(c.id));
  updateNpPlayIcon();
}

function updateNpPlayIcon(){
  const btn = document.getElementById('npPlayPause');
  if(!btn) return;
  const st = currentId && state[currentId];
  const playing = !!(st && !st.audio.paused);
  btn.disabled = !currentId;
  btn.textContent = playing ? '⏸' : '▶';
  btn.title = playing ? '一時停止' : '再生';
  btn.setAttribute('aria-label', btn.title);
  const fadeBtn = document.getElementById('npFade');
  if(fadeBtn) fadeBtn.disabled = !currentId;
}

function cancelFade(id){
  const st = state[id];
  if(!st) return;
  if(st.fadeRAF){
    cancelAnimationFrame(st.fadeRAF);
    st.fadeRAF = null;
  }
  if(st.gainNode && audioCtx){
    // 進行中のlinearRampToValueAtTimeはJS側のrAFを止めるだけでは中断されない
    // （Web Audioのオーディオクロック上でスケジュール済みのため）。cancelScheduledValues
    // で明示的にキャンセルし、その時点の音量値で固定する。
    const now = audioCtx.currentTime;
    const current = st.gainNode.gain.value;
    st.gainNode.gain.cancelScheduledValues(now);
    st.gainNode.gain.setValueAtTime(current, now);
  }
}

// 指定した1キューだけを完全停止（一時停止＋先頭に巻き戻し）し、アクティブ集合から
// 取り除く。他に同時再生中の音があっても、それらには一切影響しない。
// ※2026-07-05修正：以前はここで resetVolume(id) を呼び、gain（音量）を1に戻していたが、
// フェードアウト完了直後にここを通ると「audio.pause()が音声パイプライン上で実際に反映される
// 前に gain だけ先に1へ戻ってしまい、停止直前の一瞬だけ元の音量で鳴ってから切れる」という
// ノイズの原因になっていた（フェード完了→無音のはずが最後に一瞬だけ音が大きくなる不具合）。
// 次回再生時の音量は togglePlay() 側の再生開始処理が毎回 resetVolume(id) を呼んでから
// play() するため、ここで先回りしてリセットしなくても次回再生時の音量は正しく1に戻る。
function deactivateCue(id){
  const st = state[id];
  if(st){
    cancelFade(id);
    st.audio.pause();
    st.audio.currentTime = 0;
  }
  activeIds.delete(id);
  if(currentId === id){
    // 下部バーの表示対象が消えた場合、他にまだアクティブな音があればそれを表示対象に引き継ぐ
    const remaining = [...activeIds];
    currentId = remaining.length ? remaining[remaining.length-1] : null;
  }
}

// 非SE（song/narr/extra）は従来通り単一チャンネル：新しいキューを再生したら
// それまで再生中だった非SEキューは完全停止する。SEは対象外＝重ねて鳴らしたままにする。
function stopOtherExclusiveCues(){
  [...activeIds].forEach(activeId => {
    if(!isSeCue(activeId)) deactivateCue(activeId);
  });
}

function togglePlay(id){
  if(!state[id]){
    // 2026-08-30再改訂：ページ読込時の先読みで間に合わなかった場合の保険として、
    // クリック（ユーザー操作）のタイミングでその場で同期的にロードする。
    // awaitやPromise.then()を挟まず、ユーザーのタップと同じ同期コールスタック内で
    // play()まで完結させる必要がある（iOS Safariはユーザー操作から切り離された
    // 非同期タイミングでのaudio.play()呼び出しをブロックすることがあるため）。
    const cue = allCues().find(c => c.id === id);
    if(!cue || !loadCue(cue)) return; // 音源未登録キューは何もしない
  }
  const st = state[id];
  ensureGainNode(id); // 初回のユーザー操作でAudioContextを生成・resumeする（iOS対応）
  if(activeIds.has(id)){
    // 同じキュー：再生⇄一時停止をトグル（SEでも非SEでも共通）
    cancelFade(id);
    if(st.audio.paused){
      resetVolume(id); // フェード中に一時停止していた場合も再開時は必ずフル音量に戻す
      st.audio.play();
    } else {
      st.audio.pause();
    }
    currentId = id; // 下部バーの表示対象を、直近に操作したキューに更新
  } else if(isSeCue(id)){
    // 効果音(SE)：他の再生中の音（他のSEでもBGMでも）は止めずに重ねて再生する
    cancelFade(id);
    resetVolume(id);
    st.audio.currentTime = 0;
    st.audio.play();
    activeIds.add(id);
    currentId = id;
  } else {
    // 歌唱・BGM／ナレーション／追加音源：従来通り単一チャンネル。前の非SEキューを完全停止してから再生
    stopOtherExclusiveCues();
    cancelFade(id);
    resetVolume(id);
    st.audio.currentTime = 0;
    st.audio.play();
    activeIds.add(id);
    currentId = id;
  }
  refreshRowStates();
  updateNowPlaying();
}

function stopAll(silent){
  // 全停止（緊急停止／Escキー）：SE含め現在アクティブなすべての音をまとめて止める
  [...activeIds].forEach(id => deactivateCue(id));
  currentId = null;
  refreshRowStates();
  if(!silent) updateNowPlaying();
}

function fadeOut(id, seconds=5){
  if(!activeIds.has(id) || !state[id]) return;
  const st = state[id];
  const audio = st.audio;
  cancelFade(id); // 二重フェード防止

  const gain = ensureGainNode(id);
  const startTime = performance.now();
  const durationMs = seconds*1000;

  if(gain && audioCtx){
    // iOS Safariではaudio.volumeを直接操作しても実際の音量に反映されないため
    // （WebKitの既知の仕様。音量はハードウェアの物理ボタン／サイレントスイッチのみで
    // 制御される）、GainNodeを介して確実にフェードさせる。当初は人間の音量知覚（対数的）に
    // 合わせてexponentialRampToValueAtTime（指数関数的減衰）を使っていたが、実際に使うと
    // 「フェード序盤で急激に下がりすぎる」という指摘があったため、時間に対して均等に
    // 下がる直線的なlinearRampToValueAtTime（線形フェード）に変更した（2026-07-05）。
    // linearRampToValueAtTimeはexponentialと異なり目標値に0を直接指定できるため、
    // 完全な無音まで下げられる。
    const now = audioCtx.currentTime;
    const startVal = gain.gain.value > 0 ? gain.gain.value : 1;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(startVal, now);
    gain.gain.linearRampToValueAtTime(0, now + seconds);

    // 実際の減衰はWeb Audioのオーディオクロック上でスケジュール済みなので、この
    // requestAnimationFrameループは完了タイミングの検知（再生停止・状態リセット）専用。
    function step(){
      if(!activeIds.has(id) || !state[id] || state[id].audio !== audio){
        return;
      }
      if(performance.now() - startTime < durationMs){
        st.fadeRAF = requestAnimationFrame(step);
      } else {
        st.fadeRAF = null;
        gain.gain.cancelScheduledValues(audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        // このキュー1つだけを停止する（他に同時再生中の音があっても止めない）
        deactivateCue(id);
        refreshRowStates();
        updateNowPlaying();
      }
    }
    st.fadeRAF = requestAnimationFrame(step);
  } else {
    // Web Audio APIが使えない環境（非対応ブラウザ等）向けのフォールバック：
    // audio.volumeをrequestAnimationFrameで直線的に下げる（2026-07-05：指数関数的減衰は
    // フェード序盤で急激に下がりすぎるとの指摘があったため、時間に対して均等に下がる
    // 単純な線形フェードに変更した）。
    const startVolume = audio.volume > 0 ? audio.volume : 1;
    function step(now){
      if(!activeIds.has(id) || !state[id] || state[id].audio !== audio){
        return;
      }
      const t = Math.min(1, (now - startTime) / durationMs);
      audio.volume = Math.max(0, Math.min(startVolume, startVolume * (1 - t)));
      if(t < 1){
        st.fadeRAF = requestAnimationFrame(step);
      } else {
        st.fadeRAF = null;
        audio.volume = 0;
        // このキュー1つだけを停止する（他に同時再生中の音があっても止めない）
        deactivateCue(id);
        refreshRowStates();
        updateNowPlaying();
      }
    }
    st.fadeRAF = requestAnimationFrame(step);
  }
}

document.body.addEventListener('click', e => {
  const btn = e.target.closest('.iconbtn.play');
  if(!btn || !btn.dataset.id) return;
  togglePlay(btn.dataset.id);
});

document.getElementById('npPlayPause').addEventListener('click', () => {
  if(currentId) togglePlay(currentId);
});

document.getElementById('npFade').addEventListener('click', () => {
  if(currentId) fadeOut(currentId);
});

document.getElementById('npStop').addEventListener('click', () => stopAll());

document.addEventListener('keydown', e => {
  if(e.key === 'Escape') stopAll();
});

// --- シーク・スキップ ---
let isSeeking = false;
const npSeek = document.getElementById('npSeek');
npSeek.addEventListener('input', () => {
  if(!currentId || !state[currentId]) return;
  const audio = state[currentId].audio;
  if(audio.duration){
    audio.currentTime = (npSeek.value/1000) * audio.duration;
    updateNowPlaying();
  }
});
['mousedown','touchstart'].forEach(ev => npSeek.addEventListener(ev, () => { isSeeking = true; }));
['mouseup','touchend'].forEach(ev => npSeek.addEventListener(ev, () => { isSeeking = false; }));

function skip(sec){
  if(!currentId || !state[currentId]) return;
  const audio = state[currentId].audio;
  if(!audio.duration) return;
  audio.currentTime = Math.min(Math.max(0, audio.currentTime + sec), audio.duration);
  updateNowPlaying();
}
document.getElementById('npBack').addEventListener('click', () => skip(-10));
document.getElementById('npFwd').addEventListener('click', () => skip(10));

function updateNowPlaying(){
  const titleEl = document.getElementById('npTitle');
  const curEl = document.getElementById('npTimeCur');
  const durEl = document.getElementById('npTimeDur');
  const seekEl = document.getElementById('npSeek');
  if(!currentId || !state[currentId]){
    titleEl.textContent = '停止中';
    curEl.textContent = '00:00';
    durEl.textContent = '00:00';
    seekEl.disabled = true;
    if(!isSeeking){
      seekEl.value = 0;
      seekEl.style.background = 'var(--panel2)';
    }
    updateNpPlayIcon();
    return;
  }
  const cue = allCues().find(c => c.id === currentId);
  const audio = state[currentId].audio;
  titleEl.textContent = `${cue.id}　${cue.name}`;
  const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  seekEl.disabled = false;
  if(!isSeeking){
    seekEl.value = Math.round(pct*10);
    seekEl.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--panel2) ${pct}%)`;
  }
  curEl.textContent = fmtTime(audio.currentTime);
  durEl.textContent = fmtTime(audio.duration);
  updateNpPlayIcon();
}
setInterval(updateNowPlaying, 250);

// --- Service Worker登録（オフライン対応・PWA化） ---
// 63MBという大きなファイル自身をキャッシュするため、モバイル端末（特にiOS Safari）の
// ストレージ容量制限に引っかかりキャッシュに失敗する可能性がある。失敗してもオンライン時の
// 通常読み込みには一切影響させないよう、対応チェック・try-catch・catch()で静かに
// フォールバックする設計にしている。
if('serviceWorker' in navigator){
  // sw.js内のCACHE_NAMEを上げて再デプロイした際、既にこのページを開いている端末で
  // 新しいService Workerが有効化されたら自動で1回だけリロードし、更新（新デザイン等）を
  // 即座に反映させる（reloadingフラグで多重リロードを防止）。
  let reloading = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    try{
      navigator.serviceWorker.register('sw.js').catch(() => {
        // 登録に失敗しても機能停止させない（通常のオンライン読み込みにフォールバック）
      });
    }catch(e){
      // 古い環境・制限環境での予期しないエラーも黙って無視する
    }
  });
}
</script>
