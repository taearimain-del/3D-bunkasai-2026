  トロールの歌「愛さえあれば」歌詞タイミングツール（2026-09-12新規作成）

  【経緯】音響係から「本番中、今どこを再生しているか分からない」「特に曲の最後、
  全員が声を揃えて『ラブ！』と言う瞬間のタイミングがどうしても掴めない」という
  相談を受け、当初は既存の音響再生ツール.html（音響キュー再生ツール本体）に
  カラオケ風歌詞同期パネル・タイミングマークモードを埋め込む形で実装した。
  その後Fort様から「音響再生ツールは誰も見ないから新しいツールを作ってほしい、
  ホームページの一番上に出るようにしてほしい」という明確な方針転換の指示があり、
  同日中にこの機能一式を独立した専用ツールとして切り出した。
  埋め込み実装時に使ったロジック・演出（歌詞同期表示・マークモード・「ラブ！」
  演出）はそのまま流用しており、音響再生ツール.html自体は元の状態（この機能を
  含まない状態）に差し戻し済み（過去版/その他/20260912/を参照）。

  【最優先事項（Fort様の明示的な指示、方針転換後も変更なし）】
  本ツールで最も重要なのは、曲全体の同期精度ではなく、曲最後に全員が声を揃える
  「ラブ！」の瞬間を音響係が確実に把握できることである。そのため：
    ・カラオケ表示はその行に到達すると専用の大きな金色パルス表示に切り替わる
    ・到達5秒前から秒数カウントダウン付きの予告バナーを表示する
    ・到達した瞬間、画面全体を覆う金色フラッシュ演出が発火する
    ・マークモードに「❤ 最優先：『ラブ！』だけ先にマーク」専用ボタンがあり、
      全44行を順にマークしなくても、この1行だけ最優先で実測・登録できる
  他の歌詞行（[全員]パート含む）の同期は、上記の次に位置づけられる副次的な機能。

  【タイミングデータ】トロールの歌_歌詞タイミング.json（同フォルダ）に保存する。
  2026-09-12時点ではまだ誰も実測しておらず、全行 time:null のプレースホルダ。
  本番前に音響係が下記マークモードで実測し、エクスポートしたJSONでこのファイルを
  上書き・コミットすること（生徒用/変更点.md 2026-09-12エントリ参照）。

  歌詞本文・[全員]判定・並び順の根拠、および並び順が未検証の推定である旨は
  トロールの歌_歌詞タイミング.json 内の _readme を参照。
-->

  if(!ctx) return null;
  try{
    const source = ctx.createMediaElementSource(audio);
    gainNode = ctx.createGain();
    gainNode.gain.value = 1;
    source.connect(gainNode).connect(ctx.destination);
  }catch(e){ gainNode = null; }
  return gainNode;
}
function resetVolume(){
  audio.volume = 1;
  if(gainNode && audioCtx){
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(1, now);
  }
}
function cancelFade(){
  if(fadeRAF){ cancelAnimationFrame(fadeRAF); fadeRAF = null; }
  if(gainNode && audioCtx){
    const now = audioCtx.currentTime;
    const current = gainNode.gain.value;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(current, now);
  }
}
function fadeOut(seconds=5){
  cancelFade();
  const gain = ensureGainNode();
  const startTime = performance.now();
  const durationMs = seconds*1000;
  if(gain && audioCtx){
    const now = audioCtx.currentTime;
    const startVal = gain.gain.value > 0 ? gain.gain.value : 1;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(startVal, now);
    gain.gain.linearRampToValueAtTime(0, now + seconds);
    (function step(){
      if(performance.now() - startTime < durationMs){ fadeRAF = requestAnimationFrame(step); }
      else{
        fadeRAF = null;
        gain.gain.cancelScheduledValues(audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        audio.pause(); audio.currentTime = 0;
        updatePlayIcon();
      }
    })();
  } else {
    const startVolume = audio.volume > 0 ? audio.volume : 1;
    (function step(now){
      const t = Math.min(1, (now - startTime) / durationMs);
      audio.volume = Math.max(0, Math.min(startVolume, startVolume * (1 - t)));
      if(t < 1){ fadeRAF = requestAnimationFrame(step); }
      else{ fadeRAF = null; audio.volume = 0; audio.pause(); audio.currentTime = 0; updatePlayIcon(); }
    })(performance.now());
  }
}

function fmtTime(s){
  if(!isFinite(s)) return '00:00';
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function fmtTimeMs(s){
  if(typeof s !== 'number' || !isFinite(s)) return '00:00.00';
  const m = Math.floor(s/60), sec = s%60;
  return String(m).padStart(2,'0')+':'+sec.toFixed(2).padStart(5,'0');
}

const playPauseBtn = document.getElementById('playPause');
const seekEl = document.getElementById('seek');
let isSeeking = false;

function updatePlayIcon(){
  const playing = !audio.paused;
  playPauseBtn.textContent = playing ? '⏸' : '▶';
  playPauseBtn.title = playing ? '一時停止' : '再生';
  document.getElementById('fadeBtn').disabled = false;
}
function updateTransport(){
  const curEl = document.getElementById('timeCur');
  const remEl = document.getElementById('timeRemain');
  const pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
  if(!isSeeking){
    seekEl.value = Math.round(pct*10);
    seekEl.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--panel2) ${pct}%)`;
  }
  curEl.textContent = fmtTime(audio.currentTime);
  remEl.textContent = audio.duration ? ('-' + fmtTime(Math.max(0, audio.duration - audio.currentTime))) : '-00:00';
  updatePlayIcon();
}

audio.addEventListener('loadedmetadata', () => {
  document.getElementById('loadStatus').textContent = `読み込み済み: ${SONG_FILE}（自動読込・約${fmtTime(audio.duration)}）`;
  playPauseBtn.disabled = false;
  seekEl.disabled = false;
  updateTransport();
});
audio.addEventListener('error', () => {
  document.getElementById('loadStatus').textContent = `読み込み失敗: ${SONG_FILE}（ファイルの配置を確認してください）`;
});
audio.addEventListener('ended', () => { updatePlayIcon(); });

playPauseBtn.addEventListener('click', () => {
  ensureGainNode();
  if(audio.paused){ cancelFade(); resetVolume(); audio.play(); }
  else{ audio.pause(); }
  updatePlayIcon();
});
document.getElementById('back10').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
document.getElementById('fwd10').addEventListener('click', () => { if(audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); });
document.getElementById('fadeBtn').addEventListener('click', () => fadeOut(5));
seekEl.addEventListener('input', () => {
  if(audio.duration) audio.currentTime = (seekEl.value/1000) * audio.duration;
});
['mousedown','touchstart'].forEach(ev => seekEl.addEventListener(ev, () => { isSeeking = true; }));
['mouseup','touchend'].forEach(ev => seekEl.addEventListener(ev, () => { isSeeking = false; }));

document.addEventListener('keydown', (e) => {
  // マークモード内でのMキー等はmarkPanel側のリスナーで処理するため、入力欄フォーカス中は無視
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Escape'){
    cancelFade();
    audio.pause();
    audio.currentTime = 0;
    updatePlayIcon();
  }
});

// --- 歌詞データの読込（リポジトリJSON優先、この端末の下書きがあれば上書き適用） ---
function trollFinalLoveIndex(){ return trollLyrics.findIndex(l => l.isFinalLove); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeTrollLines(rawLines){
  if(!Array.isArray(rawLines)) return null;
  return rawLines.map((l, i) => ({
    index: typeof l.index === 'number' ? l.index : i,
    text: String(l.text || ''),
    isAll: !!l.isAll,
    isFinalLove: !!l.isFinalLove,
    time: (typeof l.time === 'number' && isFinite(l.time)) ? l.time : null,
  }));
}
function saveTrollDraft(){
  try{ localStorage.setItem(TROLL_DRAFT_KEY, JSON.stringify({savedAt: Date.now(), lines: trollLyrics})); }catch(e){}
}
function applyTrollDraftIfAny(){
  try{
    const raw = localStorage.getItem(TROLL_DRAFT_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    const normalized = normalizeTrollLines(parsed.lines);
    if(!normalized || normalized.length !== trollLyrics.length) return false;
    trollLyrics = normalized;
    return true;
  }catch(e){ return false; }
}
async function loadTrollLyrics(){
  try{
    const res = await fetch(TROLL_JSON_PATH, {cache:'no-store'});
    if(res && res.ok){
      const data = await res.json();
      const normalized = normalizeTrollLines(data.lines);
      if(normalized && normalized.length){
        trollLyrics = normalized;
        trollTimingSource = 'リポジトリ版（トロールの歌_歌詞タイミング.json）';
      }
    } else {
      trollTimingSource = '埋め込みデフォルト（JSON取得失敗・未計測）';
    }
  }catch(e){
    trollTimingSource = '埋め込みデフォルト（JSON取得失敗・未計測。file://で直接開いている場合はこれが通常）';
  }
  if(applyTrollDraftIfAny()) trollTimingSource += ' ＋ この端末の下書きを適用中';
  renderMarkList();
  updateTmStatus();
}
loadTrollLyrics();

// --- カラオケ同期表示（このページの主役） ---
function updateKaraoke(){
  const t = audio.currentTime || 0;
  let curIdx = -1;
  for(let i=0;i<trollLyrics.length;i++){
    if(typeof trollLyrics[i].time === 'number' && trollLyrics[i].time <= t) curIdx = i;
  }
  const anyMarked = trollLyrics.some(l => typeof l.time === 'number');
  const loveIdx = trollFinalLoveIndex();
  const prevEl = document.getElementById('kPrev');
  const curEl = document.getElementById('kCurrent');
  const nextEl = document.getElementById('kNext');

  if(!anyMarked){
    prevEl.innerHTML = '&nbsp;';
    curEl.innerHTML = '<span class="empty">歌詞タイミング未設定です。下の「🎤 タイミングをマークする」から登録してください（最優先は曲最後の「ラブ！」の1行です）。</span>';
    curEl.className = 'current';
    nextEl.innerHTML = '&nbsp;';
  } else if(curIdx === -1){
    prevEl.innerHTML = '&nbsp;';
    curEl.innerHTML = '<span class="empty">（まもなく歌詞開始）</span>';
    curEl.className = 'current';
    nextEl.textContent = trollLyrics[0] ? trollLyrics[0].text : '';
  } else if(curIdx === loveIdx){
    prevEl.textContent = trollLyrics[curIdx-1] ? trollLyrics[curIdx-1].text : ' ';
    curEl.innerHTML = '❤ ' + escapeHtml(trollLyrics[curIdx].text) + ' ❤';
    curEl.className = 'current love';
    nextEl.innerHTML = '&nbsp;';
  } else {
    const prev = trollLyrics[curIdx-1], cur = trollLyrics[curIdx], next = trollLyrics[curIdx+1];
    prevEl.textContent = prev ? prev.text : ' ';
    curEl.innerHTML = (cur.isAll ? '<span class="tag">全員</span>' : '') + escapeHtml(cur.text);
    curEl.className = 'current' + (cur.isAll ? ' all' : '');
    nextEl.textContent = next ? next.text : ' ';
  }

  // 最重要キュー：曲最後の「ラブ！」の予告・フラッシュ演出
  const karaokeCard = document.getElementById('karaoke');
  const existingSoon = karaokeCard.querySelector('.love-soon');
  if(existingSoon) existingSoon.remove();
  if(loveIdx >= 0){
    const loveTime = trollLyrics[loveIdx].time;
    if(typeof loveTime === 'number'){
      const untilLove = loveTime - t;
      if(untilLove > 0 && untilLove <= TROLL_LOVE_WARN_SEC){
        const div = document.createElement('div');
        div.className = 'love-soon';
        div.textContent = `🔔 まもなく全員で「ラブ！」 — あと${untilLove.toFixed(1)}秒`;
        karaokeCard.appendChild(div);
      }
      if(untilLove <= 0 && untilLove > -4){
        if(!loveFlashFired){
          loveFlashFired = true;
          const overlay = document.getElementById('loveFlashOverlay');
          overlay.classList.add('active');
          setTimeout(() => overlay.classList.remove('active'), 1150);
        }
      } else if(untilLove > 1){
        loveFlashFired = false;
      }
    }
  }
}
setInterval(() => { updateTransport(); updateKaraoke(); updateMarkModeTime(); }, 250);

// --- マークモード（同一ページ内、モーダルではなく展開パネル） ---
function updateTmStatus(){
  const el = document.getElementById('tmStatus');
  if(el){
    const markedCount = trollLyrics.filter(l => typeof l.time === 'number').length;
    el.textContent = `データソース: ${trollTimingSource} ／ 進捗: ${markedCount}/${trollLyrics.length}行 設定済み`;
  }
  const banner = document.getElementById('tmLoveBanner');
  if(banner){
    const loveIdx = trollFinalLoveIndex();
    const loveTime = loveIdx >= 0 ? trollLyrics[loveIdx].time : null;
    if(typeof loveTime === 'number'){
      banner.className = 'tm-love-banner done';
      banner.textContent = `❤ 最重要キュー「ラブ！」設定済み：${fmtTimeMs(loveTime)}（${loveTime.toFixed(2)}秒）。他の行より先にこれだけでも設定できていれば、本番の最大の課題には対応できています。`;
    } else {
      banner.className = 'tm-love-banner';
      banner.textContent = '❤ 最重要キュー「ラブ！」は未設定です。時間が無い場合、まずこの1行だけでも「❤ 最優先：『ラブ！』だけ先にマーク」ボタンから設定してください。';
    }
  }
}
function renderMarkList(){
  const list = document.getElementById('tmList');
  if(!list) return;
  const prevScroll = list.scrollTop;
  list.innerHTML = '';
  trollLyrics.forEach((line, idx) => {
    const row = document.createElement('div');
    row.className = 'tm-row' + (line.isAll ? ' all' : '') + (line.isFinalLove ? ' loveRow' : '') + (idx === tmSelectedIndex ? ' selected' : '');
    row.dataset.idx = idx;
    row.innerHTML = `
      <span class="idx">${idx+1}</span>
      <span class="tag">全員</span>
      <span class="love">${line.isFinalLove ? '❤' : ''}</span>
      <span class="txt">${escapeHtml(line.text)}</span>
      <input type="number" step="0.01" class="timeInput" placeholder="秒" value="${typeof line.time==='number' ? line.time.toFixed(2) : ''}">
      <button class="rowbtn jump" title="この時刻へシーク">▶</button>
      <button class="rowbtn clear" title="このタイミングをクリア">✕</button>
    `;
    row.addEventListener('click', (e) => {
      if(e.target.closest('input,button')) return;
      tmSelectedIndex = idx;
      renderMarkList();
    });
    row.querySelector('.timeInput').addEventListener('change', (e) => {
      const v = parseFloat(e.target.value);
      trollLyrics[idx].time = isFinite(v) ? Math.max(0, v) : null;
      saveTrollDraft();
      updateTmStatus();
    });
    row.querySelector('.jump').addEventListener('click', () => {
      if(typeof trollLyrics[idx].time === 'number') audio.currentTime = trollLyrics[idx].time;
    });
    row.querySelector('.clear').addEventListener('click', () => {
      trollLyrics[idx].time = null;
      saveTrollDraft();
      renderMarkList();
      updateTmStatus();
    });
    list.appendChild(row);
  });
  list.scrollTop = prevScroll;
}
function scrollRowIntoView(idx){
  const list = document.getElementById('tmList');
  const row = list && list.querySelector(`.tm-row[data-idx="${idx}"]`);
  if(row) row.scrollIntoView({block:'center'});
}
function markCurrentLine(){
  const t = audio.currentTime || 0;
  trollLyrics[tmSelectedIndex].time = Math.round(t*100)/100;
  saveTrollDraft();
  if(tmSelectedIndex < trollLyrics.length - 1) tmSelectedIndex += 1;
  renderMarkList();
  updateTmStatus();
  scrollRowIntoView(tmSelectedIndex);
}
function updateMarkModeTime(){
  const panel = document.getElementById('markPanel');
  if(!panel || panel.hidden) return;
  const el = document.getElementById('tmTime');
  if(el) el.textContent = fmtTimeMs(audio.currentTime);
}
function jumpToLoveLineForMarking(){
  const loveIdx = trollFinalLoveIndex();
  if(loveIdx < 0) return;
  tmSelectedIndex = loveIdx;
  renderMarkList();
  scrollRowIntoView(loveIdx);
}
function exportTrollLyricsJson(){
  const payload = {
    _readme: [
      'このファイルは「トロールの歌タイミングツール」でエクスポートされたものです。',
      '生徒用/音響ツール/トロールの歌_歌詞タイミング.json に上書き保存し、',
      'git commit / push すれば本番データとして反映されます。',
      '最重要キューは isFinalLove:true の行（曲最後に全員が「ラブ！」と言う瞬間）です。'
    ],
    songId: '07',
    songFile: SONG_FILE,
    lines: trollLyrics.map(l => {
      const o = {index:l.index, text:l.text, isAll:l.isAll, time:l.time};
      if(l.isFinalLove) o.isFinalLove = true;
      return o;
    }),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'トロールの歌_歌詞タイミング.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function importTrollLyricsJson(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      const normalized = normalizeTrollLines(data.lines);
      if(!normalized || !normalized.length){ alert('JSONの形式が想定と異なるため読み込めませんでした。'); return; }
      trollLyrics = normalized;
      trollTimingSource = `インポート（${file.name}）`;
      tmSelectedIndex = 0;
      saveTrollDraft();
      renderMarkList();
      updateTmStatus();
    }catch(e){ alert('JSONの読み込みに失敗しました: ' + e.message); }
  };
  reader.readAsText(file);
}

const markPanel = document.getElementById('markPanel');
const toggleMarkBtn = document.getElementById('toggleMarkBtn');
toggleMarkBtn.addEventListener('click', () => {
  markPanel.hidden = !markPanel.hidden;
  toggleMarkBtn.textContent = markPanel.hidden
    ? '🎤 タイミングをマークする（未設定の行がある場合はこちら）'
    : '🎤 タイミングマークを閉じる';
  if(!markPanel.hidden){
    const loveIdx = trollFinalLoveIndex();
    if(loveIdx >= 0 && typeof trollLyrics[loveIdx].time !== 'number') tmSelectedIndex = loveIdx;
    renderMarkList();
    updateTmStatus();
    scrollRowIntoView(tmSelectedIndex);
  }
});
document.getElementById('tmMarkBtn').addEventListener('click', markCurrentLine);
document.getElementById('tmJumpLoveBtn').addEventListener('click', jumpToLoveLineForMarking);
document.getElementById('tmExportBtn').addEventListener('click', exportTrollLyricsJson);
document.getElementById('tmImportInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if(f) importTrollLyricsJson(f);
  e.target.value = '';
});
document.getElementById('tmReloadRepoBtn').addEventListener('click', () => {
  if(!confirm('この端末に保存済みの下書き（未エクスポートのマーク内容）を破棄して、リポジトリ版（またはデフォルト）を読み込み直します。よろしいですか？')) return;
  try{ localStorage.removeItem(TROLL_DRAFT_KEY); }catch(e){}
  loadTrollLyrics();
});
document.getElementById('tmResetAllBtn').addEventListener('click', () => {
  if(!confirm('全行のタイミングをクリアします。よろしいですか？')) return;
  trollLyrics.forEach(l => l.time = null);
  saveTrollDraft();
  renderMarkList();
  updateTmStatus();
});
document.addEventListener('keydown', (e) => {
  if(markPanel.hidden) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'm' || e.key === 'M'){ e.preventDefault(); markCurrentLine(); }
});

// --- Service Worker登録（同フォルダのsw.jsを共有、オフライン対応） ---
if('serviceWorker' in navigator){
  let reloading = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    try{ navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
  });
}
