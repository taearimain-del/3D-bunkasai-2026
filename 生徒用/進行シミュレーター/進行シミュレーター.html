<meta charset="UTF-8" />
<title>アナと雪の女王 進行シミュレーター</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#14161c;
    --panel:#1e212b;
    --panel-2:#262a36;
    --line:#343a4a;
    --ink:#eef0f4;
    --ink-dim:#9aa3b5;
    --ink-faint:#6b7286;
    --accent:#e0763f;
    --accent-ice:#7ec8e3;
    --dept-light:#f2c14e;
    --dept-sound:#b98ce0;
    --dept-set:#7f9e6b;
    --dept-props:#cf8a5c;
    --dept-stage:#9aa8c9;
    --dept-video:#4fd1c5;
    --dept-costume:#e0709c;
    --font-display:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.6;
    padding:20px 16px 60px;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

  /* ---- header ---- */
  header{display:flex;flex-direction:column;gap:6px;padding:4px 4px 14px;border-bottom:1px solid var(--line);}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:var(--dept-video);text-transform:uppercase;}
  h1{font-family:var(--font-display);font-weight:700;font-size:clamp(22px,3.6vw,32px);margin:0;text-wrap:balance;color:var(--ink);}
  .sub{color:var(--ink-dim);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px 18px;}
  .sub b{color:var(--ink);font-weight:600;}
  #timeNote{color:var(--accent-ice);}

  /* ---- transport ---- */
  .console{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;}

  .timeline-shell{position:relative;}
  .timeline{
    position:relative;height:46px;border-radius:8px;overflow:hidden;
    display:flex;cursor:pointer;border:1px solid var(--line);
  }
  .actseg{
    position:relative;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:rgba(255,255,255,.82);letter-spacing:.02em;
    border-right:1px solid rgba(0,0,0,.35);
    transition:filter .15s;
  }
  .actseg:last-child{border-right:none;}
  .actseg span{position:relative;z-index:2;padding:0 4px;text-align:center;text-wrap:balance;}
  .actseg.active{filter:brightness(1.28);}
  .transseg{
    position:relative;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(135deg,#3a3f4d,#3a3f4d 5px,#2a2e3a 5px,#2a2e3a 10px);
    border-right:1px solid rgba(0,0,0,.35);min-width:4px;
    transition:filter .15s;
  }
  .transseg span{font-size:9px;color:var(--ink-faint);letter-spacing:.02em;position:relative;z-index:2;}
  .transseg.active{filter:brightness(1.6);background:repeating-linear-gradient(135deg,var(--accent),var(--accent) 5px,#5a3a20 5px,#5a3a20 10px);}
  .transseg.active span{color:#1a1006;font-weight:700;}
  .playhead{
    position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--accent-ice);
    box-shadow:0 0 10px 1px var(--accent-ice);pointer-events:none;z-index:5;
  }
  .playhead::before{
    content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;
    border-top:7px solid var(--accent-ice);
  }
  .ticks{display:flex;justify-content:space-between;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--ink-faint);padding:0 1px;}

  .transport{display:flex;flex-wrap:wrap;align-items:center;gap:14px;}
  .transport-group{display:flex;align-items:center;gap:8px;}
  button.tbtn{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:8px 14px;font-family:var(--font-body);font-size:14px;cursor:pointer;transition:background .15s,border-color .15s;
  }
  button.tbtn:hover{border-color:var(--accent);}
  button.tbtn:focus-visible{outline:2px solid var(--accent-ice);outline-offset:2px;}
  button.tbtn.play{background:var(--accent);border-color:var(--accent);color:#1a1006;font-weight:700;min-width:74px;}
  button.tbtn.play:hover{filter:brightness(1.08);}
  select#speed{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font-family:var(--font-mono);font-size:13px;
  }
  .clock{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:20px;color:var(--ink);letter-spacing:.02em;}
  .clock .sep{color:var(--ink-faint);}
  .clock .tot{color:var(--ink-dim);font-size:14px;}
  .actnow{font-size:13px;color:var(--dept-video);margin-left:auto;white-space:nowrap;}
  input#seek{
    background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;
    padding:8px 8px;font-family:var(--font-mono);width:70px;font-size:13px;text-align:center;
  }

  /* ---- main grid ---- */
  .grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;}
  .card h2{font-family:var(--font-display);font-size:14px;margin:0 0 10px;color:var(--ink-dim);font-weight:600;letter-spacing:.03em;}

  .scene-card{display:flex;flex-direction:column;gap:4px;}
  .scene-act{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;}
  .scene-title{font-family:var(--font-display);font-size:21px;color:var(--ink);text-wrap:balance;}
  .scene-people{font-size:12.5px;color:var(--ink-dim);}

  .stage-card{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative;overflow:hidden;}
  .stage-card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% -10%,rgba(224,118,63,.14),transparent 60%);
    pointer-events:none;
  }
  .line-speaker{font-family:var(--font-display);font-size:18px;color:var(--accent);font-weight:700;position:relative;}
  .line-text{font-size:23px;line-height:1.55;color:var(--ink);text-wrap:balance;position:relative;min-height:1.6em;}
  .line-text.direction{font-size:16px;color:var(--ink-dim);font-style:normal;}
  .song-badge{
    display:inline-flex;align-items:center;gap:8px;background:rgba(126,200,227,.12);
    border:1px solid var(--accent-ice);color:var(--accent-ice);border-radius:999px;
    padding:5px 14px;font-size:13px;width:fit-content;position:relative;
  }
  .song-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;position:relative;}
  .song-bar > i{display:block;height:100%;background:var(--accent-ice);border-radius:2px;transition:width .2s linear;}
  .song-notes{font-size:13px;color:var(--ink-dim);position:relative;}
  .song-notes ul{margin:6px 0 0;padding-left:18px;}
  .song-notes li{margin-bottom:3px;}

  .trans-badge{
    display:inline-flex;align-items:center;gap:8px;background:rgba(224,118,63,.14);
    border:1px solid var(--accent);color:var(--accent);border-radius:999px;
    padding:5px 14px;font-size:13px;width:fit-content;position:relative;
  }
  .trans-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;position:relative;}
  .trans-bar > i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s linear;}
  .trans-notes{font-size:13px;color:var(--ink-dim);position:relative;}
  .trans-notes ol{margin:6px 0 0;padding-left:18px;}
  .trans-notes li{margin-bottom:3px;}

  .next-preview{font-size:12.5px;color:var(--ink-faint);border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;position:relative;}
  .next-preview b{color:var(--ink-dim);font-weight:600;}

  /* ---- 舞台構成図 ---- */
  .layout-card{display:flex;flex-direction:column;gap:8px;}
  .layout-card .layout-caption{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
  .layout-svg-wrap{
    background:#fff;border-radius:10px;padding:8px;overflow-x:auto;
    border:1px solid var(--line);
  }
  .layout-svg-wrap svg{display:block;margin:0 auto;max-width:100%;height:auto;}

  /* ---- dept board ---- */
  .board{display:flex;flex-direction:column;gap:10px;}
  .dept{
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--dept-c,var(--ink-faint));
    border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;
    transition:background .2s;
  }
  .dept.hot{background:color-mix(in srgb, var(--dept-c) 10%, var(--panel));}
  .dot{
    width:11px;height:11px;border-radius:50%;background:var(--dept-c,var(--ink-faint));
    margin-top:5px;flex:none;box-shadow:0 0 0 3px color-mix(in srgb, var(--dept-c) 22%, transparent);
    transition:box-shadow .2s,opacity .2s;opacity:.35;
  }
  .dept.hot .dot{opacity:1;box-shadow:0 0 8px 2px var(--dept-c);}
  .dept-body{flex:1;min-width:0;}
  .dept-label{font-size:11.5px;letter-spacing:.06em;color:var(--dept-c,var(--ink-dim));text-transform:uppercase;margin-bottom:3px;}
  .dept-text{font-size:13.5px;color:var(--ink);line-height:1.5;}
  .dept-text.empty{color:var(--ink-faint);}

  footer{text-align:center;font-size:12px;color:var(--ink-faint);padding-top:8px;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
  }
</style>

<div class="wrap">

  <header>
    <div class="eyebrow">3年D組 文化祭舞台公演</div>
    <h1>アナと雪の女王　進行シミュレーター</h1>
    <div class="sub">
      台本表記：<b>上演時間 約40分</b>（ACT1〜7、各ACTの目安：5 / 5 / 8 / 6 / 10 / 1 / 5 分）
      ／ このツールでの試算：<b id="computedTotal">計算中…</b>
      <span id="timeNote"></span>
    </div>
  </header>

  <div class="console">
    <div class="timeline-shell">
      <div class="timeline" id="timeline"></div>
      <div class="ticks" id="ticks"></div>
    </div>

    <div class="transport">
      <div class="transport-group">
        <button class="tbtn play" id="playBtn">▶ 再生</button>
        <button class="tbtn" id="resetBtn">⏮ 最初</button>
      </div>
      <div class="transport-group">
        <button class="tbtn" id="prevBtn">◀ 前のセリフ</button>
        <button class="tbtn" id="nextBtn">次のセリフ ▶</button>
      </div>
      <div class="transport-group">
        <label for="speed" style="font-size:12.5px;color:var(--ink-dim);">再生速度</label>
        <select id="speed">
          <option value="1">等倍(実時間)</option>
          <option value="5">×5</option>
          <option value="15" selected>×15</option>
          <option value="30">×30</option>
          <option value="60">×60</option>
        </select>
      </div>
      <div class="transport-group">
        <label for="seek" style="font-size:12.5px;color:var(--ink-dim);">移動(分:秒)</label>
        <input type="text" id="seek" placeholder="0:00" />
        <button class="tbtn" id="seekBtn">移動</button>
      </div>
      <div class="clock"><span id="curTime">0:00</span><span class="sep"> / </span><span class="tot" id="totTime">--:--</span></div>
      <div class="actnow" id="actNow">ACT1 幼い日の姉妹</div>
    </div>
  </div>

  <div class="grid">
    <div style="display:flex;flex-direction:column;gap:16px;">
      <div class="card scene-card">
        <h2>現在の場面</h2>
        <div class="scene-act" id="sceneAct">ACT1</div>
        <div class="scene-title" id="sceneTitle">夜の子ども部屋</div>
        <div class="scene-people" id="scenePeople">登場人物：子供アナ、子供エルサ、ナレーター</div>
      </div>

      <div class="card stage-card" id="stageCard">
        <div id="lineArea"></div>
        <div class="next-preview" id="nextPreview"></div>
      </div>

      <div class="card layout-card">
        <h2>舞台構成（教室レイアウト・上から見た図）</h2>
        <div class="layout-svg-wrap" id="layoutSvg"></div>
        <div class="layout-caption" id="layoutCaption"></div>
      </div>
    </div>

    <div class="board" id="board"></div>
  </div>

  <footer>台本「台本_アナと雪の女王.md」・「舞台構成.md」をもとに自動生成。セリフ・キューの秒数、ACT間の転換時間は台本・舞台構成資料の目安をもとにした試算であり、実測値ではありません。</footer>
</div>

<script>
/* ===================== 台本データ ===================== */
const DEPTS = {
  light:  {label:"照明",     color:"var(--dept-light)"},
  sound:  {label:"音響",     color:"var(--dept-sound)"},
  set:    {label:"大道具",   color:"var(--dept-set)"},
  props:  {label:"小道具",   color:"var(--dept-props)"},
  stage:  {label:"舞台監督", color:"var(--dept-stage)"},
  video:  {label:"映像担当", color:"var(--dept-video)"},
  costume:{label:"衣装",     color:"var(--dept-costume)"},
};
const DEPT_ORDER = ["light","sound","stage","set","props","video","costume"];

function song(title,singer,dur,notes,cues){return {k:"song",title,singer,dur,notes:notes||[],cues:cues||[]};}
function line(sp,text,scene){return {k:"line",sp,text,scene};}
function dir(text,scene){return {k:"dir",text,scene};}
function cue(dept,text,scene){return {k:"cue",dept,text,scene};}
function trans(label,dur,notes,cues){return {k:"trans",label,dur,notes:notes||[],cues:cues||[]};}

const ACTS = [
{
  id:1, name:"ACT1　幼い日の姉妹", scene:"夜の子ども部屋", people:"子供アナ、子供エルサ、ナレーター",
  beats:[
    cue("video","星空・城のシルエットをホワイトボードに投影。開演の合図と同時にスタート、ACT1暗転（雪だるまつくろう終わり）で停止。客席後方・上手寄りに定位。"),
    cue("sound","開演予定時刻の1分30秒前、舞台監督（または開場担当）の合図でイントロ（開演前BGM）の再生を開始。"),
    cue("stage","全係の準備完了を確認してから「開演」の合図。照明係へ客席照明OFFの指示、音響係へイントロ停止の指示。"),
    cue("light","開幕：客席の照明を消し、舞台は暗転。徐々に明るく（夜の子ども部屋のイメージ）。"),
    dir("舞台：簡素な子ども部屋。上手のベッドで子供エルサ、下手のベッドで子供アナが眠っている。照明が明るくなると子供アナがむくりと起き上がる。"),
    line("ナレーター","昔、アレンデールという王国にアナとエルサという仲の良い姉妹がいました。姉のエルサは、氷の魔法を操る不思議な力を持っていました。"),
    dir("子供アナが自分のベッドを抜け出し、忍び足で子供エルサに駆け寄り体を揺さぶる。"),
    line("子供アナ","エルサ。ねぇエルサ起きて。一緒に遊ぼうよ～。"),
    line("子供エルサ","だめよアナ、もう寝ないと…。"),
    line("子供アナ","え～？パパとママは寝てるし、私たちは起きてるじゃない！…そうだ、雪だるま！雪だるまを作ろう？"),
    dir("二人は立ち上がり中央へ。子供エルサが両手を広げ雪を降らせる魔法を表現し、雪玉を積み重ねるパントマイムで雪だるまを作る。"),
    line("子供エルサ","やあ、僕はオラフ。ぎゅ～って抱きしめて。"),
    line("子供アナ","オラフ～！ねえ、もっと魔法見せて！"),
    cue("sound","SE：魔法発動音（「シュワッ」「パキン」系の短い音）を再生。"),
    dir("徐々にエスカレートする魔法。子供エルサが大きく手を振り上げた瞬間、誤って子供アナの方向へ魔法が飛び、子供アナがくずおれる。"),
    cue("light","子供アナが魔法に当たる瞬間：一瞬だけ舞台を白くフラッシュ→すぐ暗転。"),
    dir("子供エルサが一瞬凍りついたように立ちすくみ、すぐに駆け寄って抱き起こす。声を震わせ必死に呼びかける。"),
    line("子供エルサ","アナ…？アナ！"),
    line("ナレーター","アナはトロールの力でエルサの魔法の記憶を消し、一命を取り留めることができました。一方、エルサは能力を抑えるため、城に閉じこもるようになりました。"),
    dir("子供エルサはうつむいたまま、自分の殻に閉じこもるように上手袖へと退場する。"),
    dir("舞台には子供アナが一人残る。黒板の一角に貼られた紙製の簡易ドアパネルに向き合う位置に立つ。"),
    song("雪だるまつくろう","子供アナ",180,
      ["1番・2番・ラスサビ前の計3回、ドアをノックして返事を待つが応答はない"],
      [{dept:"light",text:"各ノックの直後（計2〜3回）、一瞬（1秒程度）照明を落として戻す。「また1年が経った」ことを暗示する瞬間暗転。"},
       {dept:"sound",text:"歌い終わりに合わせてフェードアウト。"},
       {dept:"light",text:"歌の最後のフレーズで本当の暗転に入る→次の場面（戴冠式）の役者・小道具が配置につく。"}]
    ),
    cue("sound","♪ 曲終了。"),
  ]
},
{
  id:2, name:"ACT2　戴冠式とハンスとの出会い", scene:"戴冠式の朝／城の広間", people:"夏アナ、大人エルサ、ハンス、家来/司祭、ウェーゼルトン公爵、ナレーター",
  beats:[
    cue("video","アレンデール王国の旗や城の紋章を投影。ACT2の照明点灯と同時にスタート、舞踏会（とびら開けて）の暗転で停止。"),
    dir("戴冠式当日の朝。夏アナと家来のやり取りはすべてバックステージ（黒板手前の黒幕の裏）での声のみの掛け合い。夏アナは『生まれてはじめて』歌い出し直前まで舞台に出てこない。"),
    line("ナレーター","三年後、エルサが王位を継ぐ戴冠式の日が来ました。アナは目を覚まします。"),
    cue("light","家来役はバックステージから呼びかけるのみ（舞台上には出ない）。"),
    line("家来","王女！アナ王女！お目覚めください！今日は女王の戴冠式でございます！"),
    line("夏アナ","え…たいかんしき…？―そうだ戴冠式！やっとエルサに会える！"),
    dir("夏アナのセリフもバックステージから声のみ。ここで暗転し、舞台上の配置を完成させる。"),
    cue("light","戴冠式直前：照明は明るく厳かな白または淡い黄色に切り替える。夏アナが正装で登場するまで約20秒。"),
    song("生まれてはじめて","夏アナ",150,
      ["上手→中央→下手と舞台上を巡りながら歌う。終盤、中央へ戻ったところでハンスと正面から軽くぶつかる"],
      [{dept:"sound",text:"二番から再生。ハンスとぶつかる直前にフェードアウト。"}]
    ),
    cue("sound","♪ 曲終了。"),
    line("ハンス","大丈夫？怪我はないかい？", "ハンスとの出会い"),
    line("夏アナ","ええ私は大丈夫よ、こちらこそごめんなさい。"),
    line("ハンス","よかった。僕はサザンアイルズのハンス王子です。"),
    line("夏アナ","アレンデールのアナ王女です。"),
    line("ハンス","王女様！？私のご無礼をどうかお許しください！"),
    line("夏アナ","えっ！ああいや全然！私って結構ドジだしおっちょこちょいだし。姉のエルサじゃなくてよかったわね。…いけない！もうすぐ戴冠式が始まっちゃう！私もう行かなきゃ！さようなら、また会えるといいわね！"),

/* ===================== タイムライン構築 ===================== */
function beatDur(b){
  if(b.k==="song" || b.k==="trans") return b.dur;
  if(b.k==="cue") return 0;
  const len=(b.text||"").length;
  if(b.k==="line") return Math.max(1.5, len/5.5);
  if(b.k==="dir") return Math.max(2, len/10);
  return 2;
}

const FLAT=[];
const TRANS_SEGMENTS=[];
let clock=0;
ACTS.forEach(act=>{
  const actStart=clock;
  act.beats.forEach(b=>{
    const d=beatDur(b);
    const start=clock, end=clock+d;
    clock=end;
    FLAT.push(Object.assign({},b,{actId:act.id,actName:act.name,start,end,dur:d}));
  });
  act.startSec=actStart; act.endSec=clock;
  const tr=TRANSITIONS[act.id];
  if(tr){
    const start=clock, end=clock+tr.dur;
    clock=end;
    FLAT.push(Object.assign({},tr,{actId:act.id,actName:act.name,start,end,dur:tr.dur}));
    TRANS_SEGMENTS.push({fromAct:act.id,start,end,label:tr.label});
  }
});
const TOTAL=clock;

// dept & scene の前方補完スナップショット
const deptState={}; DEPT_ORDER.forEach(d=>deptState[d]=null);
let sceneState={act:ACTS[0].id,title:ACTS[0].scene,people:ACTS[0].people};
FLAT.forEach(b=>{
  if(b.k==="trans"){
    sceneState={act:b.actId,title:"🔧 転換中："+b.label,people:(ACTS.find(a=>a.id===b.actId)||{}).people};
  } else if(b.scene){
    sceneState={act:b.actId,title:b.scene,people:(ACTS.find(a=>a.id===b.actId)||{}).people};
  } else {
    const act=ACTS.find(a=>a.id===b.actId);
    if(sceneState.act!==b.actId){ sceneState={act:b.actId,title:act.scene,people:act.people}; }
  }
  if(b.k==="cue"){ deptState[b.dept]=b.text; }
  if(b.k==="song"){
    deptState.sound = "♪『"+b.title+"』 再生中（歌："+b.singer+"）";
    (b.cues||[]).forEach(c=>{ deptState[c.dept]=c.text; });
  }
  if(b.k==="trans"){
    (b.cues||[]).forEach(c=>{ deptState[c.dept]=c.text; });
  }
  b.deptSnap=Object.assign({},deptState);
  b.sceneSnap=Object.assign({},sceneState);
});
const mainBeats=FLAT.filter(b=>b.k!=="cue");

// 場面タイトル → 舞台構成図のキー（一致しない場合はACTごとの既定図にフォールバック）

const ACT_DEFAULT_DIAGRAM = {1:"act1",2:"act2_coronation",3:"act3",4:"act4",5:"act5_ice",6:"act6",7:"act7"};
const TRANS_DIAGRAM = {5:"trans5",6:"trans6"};

function pickDiagram(cueRef){
  if(cueRef.k==="trans"){
    return DIAGRAMS[TRANS_DIAGRAM[cueRef.actId] || ACT_DEFAULT_DIAGRAM[cueRef.actId]];
  }
  const title=cueRef.sceneSnap.title;
  return DIAGRAMS[SCENE_TO_DIAGRAM[title]] || DIAGRAMS[ACT_DEFAULT_DIAGRAM[cueRef.sceneSnap.act]];
}

const timelineEl=document.getElementById("timeline");

ACTS.forEach(act=>{
  const pct=((act.endSec-act.startSec)/TOTAL*100);
  const hueSeed=(act.id*47)%360;
  const seg=document.createElement("div");
  seg.className="actseg";
  seg.style.width=pct+"%";
  seg.style.background=`linear-gradient(180deg, hsl(${hueSeed} 38% 22%), hsl(${hueSeed} 30% 14%))`;
  seg.dataset.act=act.id;
  seg.innerHTML=`<span>ACT${act.id}</span>`;
  timelineEl.appendChild(seg);

  const tr=TRANS_SEGMENTS.find(s=>s.fromAct===act.id);
  if(tr){
    const tpct=((tr.end-tr.start)/TOTAL*100);
    const tseg=document.createElement("div");
    tseg.className="transseg";
    tseg.style.width=Math.max(tpct,0.6)+"%";
    tseg.dataset.transStart=tr.start;
    tseg.dataset.transEnd=tr.end;
    tseg.title=tr.label+"（"+Math.round(tr.end-tr.start)+"秒）";

    timelineEl.appendChild(tseg);

});

}
[0,0.25,0.5,0.75,1].forEach(f=>{
  const s=document.createElement("span");
  s.textContent=fmt(TOTAL*f);
  ticksEl.appendChild(s);
});

document.getElementById("totTime").textContent=fmt(TOTAL);
document.getElementById("computedTotal").textContent="約"+Math.round(TOTAL/60)+"分（自然な会話ペースでの試算）";
const noteEl=document.getElementById("timeNote");
if(TOTAL/60 > 47 || TOTAL/60 < 33){
  noteEl.textContent = "※ 台本の「約40分」との差が大きめです。特にACT2・ACT6は台本のタイム表記に対しセリフ量が多く、実際はもっとかかる可能性があります。";
}

DEPT_ORDER.forEach(key=>{
  const d=DEPTS[key];
  const el=document.createElement("div");
  el.className="dept";
  el.id="dept-"+key;
  el.style.setProperty("--dept-c",d.color);
  el.innerHTML=`<div class="dot"></div><div class="dept-body"><div class="dept-label">${d.label}</div><div class="dept-text empty">まだ指示なし</div></div>`;
  boardEl.appendChild(el);
});

/* ===================== 再生・描画ロジック ===================== */
let t=0, playing=false, speed=15, lastTs=null;

function findBeat(arr,time){
  let lo=0,hi=arr.length-1,ans=arr[0];
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(arr[mid].start<=time){ans=arr[mid]; lo=mid+1;} else {hi=mid-1;}
  }
  return ans;
}

function render(){
  t=Math.min(Math.max(t,0),TOTAL);
  document.getElementById("curTime").textContent=fmt(t);
  const pct=t/TOTAL*100;
  playhead.style.left=pct+"%";

  document.querySelectorAll(".actseg").forEach(seg=>{
    const act=ACTS.find(a=>a.id==seg.dataset.act);
    seg.classList.toggle("active", t>=act.startSec && t<act.endSec || (t>=TOTAL && act.id===ACTS.length));
  });
  document.querySelectorAll(".transseg").forEach(seg=>{
    const s=parseFloat(seg.dataset.transStart), e=parseFloat(seg.dataset.transEnd);
    seg.classList.toggle("active", t>=s && t<e);
  });

  const cueRef=findBeat(FLAT,t);
  const mainB=findBeat(mainBeats,t);
  const scene=cueRef.sceneSnap;
  const act=ACTS.find(a=>a.id===scene.act);

  document.getElementById("actNow").textContent=act.name;
  document.getElementById("sceneAct").textContent="ACT"+scene.act;
  document.getElementById("sceneTitle").textContent=scene.title;
  document.getElementById("scenePeople").textContent="登場人物："+scene.people;

  // 現在のセリフ／演技／歌
  const lineArea=document.getElementById("lineArea");
  if(mainB.k==="song"){
    const elapsed=Math.max(0,Math.min(mainB.dur, t-mainB.start));
    const pctSong=Math.round(elapsed/mainB.dur*100);
    lineArea.innerHTML=`
      <div class="song-badge">♪ 歌唱中：『${mainB.title}』（${mainB.singer}）</div>
      <div class="song-bar"><i style="width:${pctSong}%"></i></div>
      <div class="song-notes">${(mainB.notes||[]).map(n=>"<div>"+n+"</div>").join("")}
        <ul>${(mainB.cues||[]).map(c=>"<li>"+DEPTS[c.dept].label+"："+c.text+"</li>").join("")}</ul>
      </div>`;
  } else if(mainB.k==="trans"){
    const elapsed=Math.max(0,Math.min(mainB.dur, t-mainB.start));
    const pctTrans=Math.round(elapsed/mainB.dur*100);
    const remain=Math.max(0,Math.round(mainB.dur-elapsed));
    lineArea.innerHTML=`
      <div class="trans-badge">🔧 転換中：${mainB.label}（残り${remain}秒）</div>
      <div class="trans-bar"><i style="width:${pctTrans}%"></i></div>
      <div class="trans-notes"><ol>${(mainB.notes||[]).map(n=>"<li>"+n+"</li>").join("")}</ol></div>`;
  } else if(mainB.k==="line"){
    lineArea.innerHTML=`<div class="line-speaker">${mainB.sp}</div><div class="line-text">${mainB.text}</div>`;
  } else {
    lineArea.innerHTML=`<div class="line-speaker" style="color:var(--ink-dim);">（ト書き・演技中）</div><div class="line-text direction">${mainB.text}</div>`;
  }

  // 次のセリフ予告
  const idx=mainBeats.indexOf(mainB);
  const nxt=mainBeats[idx+1];
  const prevEl=document.getElementById("nextPreview");
  if(nxt){
    const label = nxt.k==="song" ? ("♪ 『"+nxt.title+"』（"+nxt.singer+"）")
      : nxt.k==="trans" ? ("🔧 "+nxt.label+"（約"+nxt.dur+"秒）")
      : nxt.k==="line" ? (nxt.sp+"「"+nxt.text.slice(0,26)+(nxt.text.length>26?"…":"")+"」")
      : ("（演技）"+nxt.text.slice(0,26)+(nxt.text.length>26?"…":""));
    prevEl.innerHTML=`<b>${fmt(nxt.start)} 〜</b>　次：${label}`;
  } else {
    prevEl.textContent="この後：フィナーレの幕引き。";
  }

  // 舞台構成図
  const diag=pickDiagram(cueRef);
  if(diag){
    if(layoutSvgEl.dataset.cur!==diag.svg){
      layoutSvgEl.innerHTML=diag.svg;
      layoutSvgEl.dataset.cur=diag.svg;
    }
    document.getElementById("layoutCaption").textContent=diag.caption;
  }

  // 係ボード
  DEPT_ORDER.forEach(key=>{
    const el=document.getElementById("dept-"+key);
    const txt=cueRef.deptSnap[key];
    const textEl=el.querySelector(".dept-text");
    const isFresh = cueRef.k==="cue" && cueRef.dept===key && Math.abs(t-cueRef.start) < 6;
    const isSongFresh = cueRef.k==="song" && cueRef.start<=t && t < cueRef.start+6 && (cueRef.cues||[]).some(c=>c.dept===key);
    const isTransFresh = cueRef.k==="trans" && cueRef.start<=t && t<cueRef.end && (cueRef.cues||[]).some(c=>c.dept===key);
    el.classList.toggle("hot", isFresh||isSongFresh||isTransFresh || (key==="sound" && cueRef.k==="song"));
    if(txt){ textEl.textContent=txt; textEl.classList.remove("empty"); }
    else { textEl.textContent="まだ指示なし"; textEl.classList.add("empty"); }
  });
}

function loop(ts){
  if(!playing) return;
  if(lastTs==null) lastTs=ts;
  const dt=(ts-lastTs)/1000;
  lastTs=ts;
  t+=dt*speed;
  if(t>=TOTAL){ t=TOTAL; playing=false; document.getElementById("playBtn").textContent="▶ 再生"; render(); return; }
  render();
  requestAnimationFrame(loop);
}

document.getElementById("playBtn").addEventListener("click",()=>{
  playing=!playing;
  document.getElementById("playBtn").textContent = playing ? "⏸ 一時停止" : "▶ 再生";
  if(playing){ lastTs=null; requestAnimationFrame(loop); }
});
document.getElementById("resetBtn").addEventListener("click",()=>{ t=0; render(); });
document.getElementById("prevBtn").addEventListener("click",()=>{
  const cur=findBeat(mainBeats,t);
  const idx=mainBeats.indexOf(cur);
  const target=mainBeats[Math.max(0,idx-1)];
  t=target.start; render();
});
document.getElementById("nextBtn").addEventListener("click",()=>{
  const cur=findBeat(mainBeats,t);
  const idx=mainBeats.indexOf(cur);
  const target=mainBeats[Math.min(mainBeats.length-1,idx+1)];
  t=target.start; render();
});
document.getElementById("speed").addEventListener("change",e=>{ speed=parseFloat(e.target.value); });
document.getElementById("seekBtn").addEventListener("click",()=>{
  const v=document.getElementById("seek").value.trim();
  const m=v.match(/^(\d+):(\d{1,2})$/);
  let sec=null;
  if(m) sec=parseInt(m[1])*60+parseInt(m[2]);
  else if(/^\d+$/.test(v)) sec=parseInt(v);
  if(sec!=null){ t=sec; render(); }
});
timelineEl.addEventListener("click",e=>{
  const rect=timelineEl.getBoundingClientRect();
  const frac=(e.clientX-rect.left)/rect.width;
  t=Math.min(Math.max(frac,0),1)*TOTAL;
  render();
});

render();
</script>
