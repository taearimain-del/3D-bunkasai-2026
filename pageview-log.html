<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>閲覧ログ（管理者専用）</title>
<style>
  :root{ --bg:#0f1115; --card:#171a21; --line:#2a2e38; --text:#e8e9ee; --muted:#9aa0ac; --accent:#5b8cff; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --card:#ffffff; --line:#e2e4e9; --text:#1b1d22; --muted:#5c6270; --accent:#2a5fd6; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
  }
  .wrap{ max-width:1280px; margin:0 auto; }
  h1{ font-size:1.4rem; margin-bottom:4px; }
  .sub{ color:var(--muted); font-size:0.85rem; margin-bottom:20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  button{
    padding:10px 18px; border-radius:8px; border:none; background:var(--accent); color:#fff;
    font-size:0.95rem; cursor:pointer;
  }
  button:hover{ opacity:0.9; }
  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th, td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--muted); font-weight:600; white-space:nowrap; }
  td.clicks{ max-width:220px; }
  td.gpu{ max-width:200px; font-size:0.78rem; word-break:break-word; }
  .click-item{ display:block; color:var(--muted); }
  .empty{ color:var(--muted); padding:20px 0; }
  .err{ color:#e05a5a; }
  .table-wrap{ overflow-x:auto; }
  .visitor, .fp{ font-family:monospace; font-size:0.75rem; color:var(--muted); }
  .fp{ padding:2px 6px; border-radius:5px; color:#1b1d22; font-weight:600; }
  .legend{ color:var(--muted); font-size:0.8rem; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>閲覧ログ（管理者専用）</h1>
  <p class="sub">shiryo.html のアクセス記録。管理者のGoogleアカウントでログインすると表示されます。</p>

  <div class="card" id="login-card">
    <button id="login-btn">Googleでログイン</button>
    <p id="login-msg" class="err" style="display:none;"></p>
  </div>

  <div class="card" id="log-card" style="display:none;">
    <p class="legend">同じ色の「端末指紋」は同一端末からのアクセスです。位置情報・時間帯・見た資料と合わせて閲覧者を推測してください（氏名までは技術上取得できません）。</p>
    <div class="table-wrap">
      <table id="log-table">
        <thead>
          <tr>
            <th>日時</th>
            <th>端末指紋</th>
            <th>ブラウザ/OS</th>
            <th>GPU</th>
            <th>画面</th>
            <th>TZ</th>
            <th>位置情報</th>
            <th>IP</th>
            <th>参照元</th>
            <th>クリックした資料</th>
            <th>端末ID</th>
          </tr>
        </thead>
        <tbody id="log-body"></tbody>
      </table>
    </div>
    <p id="log-empty" class="empty" style="display:none;">まだ閲覧記録はありません。</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

  const ADMIN_EMAIL = "ryu20001208.jp@gmail.com";

  const firebaseConfig = {
    apiKey: "AIzaSyCT3kB44SweowSshAxHKCo2wKM5XqsD2SQ",
    authDomain: "d-bunkasai.firebaseapp.com",
    databaseURL: "https://d-bunkasai-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "d-bunkasai",
    storageBucket: "d-bunkasai.firebasestorage.app",
    messagingSenderId: "709713875911",
    appId: "1:709713875911:web:8ee19207018491ea60ffe2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const loginCard = document.getElementById('login-card');
  const loginMsg = document.getElementById('login-msg');
  const logCard = document.getElementById('log-card');
  const logBody = document.getElementById('log-body');
  const logEmpty = document.getElementById('log-empty');

  document.getElementById('login-btn').addEventListener('click', () => {
    signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => {
      loginMsg.textContent = 'ログインに失敗しました: ' + e.message;
      loginMsg.style.display = 'block';
    });
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function parseUA(ua) {
    if (!ua) return '不明';
    let os = '不明OS';
    if (/Windows/.test(ua)) os = 'Windows';
    else if (/Mac OS X/.test(ua)) os = 'Mac';
    else if (/Android/.test(ua)) os = 'Android';
    else if (/iPhone|iPad|iPod/.test(ua)) os = 'iOS';
    else if (/Linux/.test(ua)) os = 'Linux';

    let browser = '不明ブラウザ';
    if (/Edg\//.test(ua)) browser = 'Edge';
    else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) browser = 'Chrome';
    else if (/Firefox\//.test(ua)) browser = 'Firefox';
    else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browser = 'Safari';
    return `${browser} / ${os}`;
  }

  function formatGeo(item) {
    const parts = [item.country, item.region, item.city].filter(Boolean);
    const loc = parts.length ? parts.join(' ') : '不明';
    return item.org ? `${loc}（${item.org}）` : loc;
  }

  // 指紋IDから淡いパステル背景色を生成（同一端末を色でグルーピングするため）
  function fpColor(fp) {
    if (!fp) return 'transparent';
    let h = 0;
    for (let i = 0; i < fp.length; i++) h = (h * 31 + fp.charCodeAt(i)) % 360;
    return `hsl(${h}, 70%, 80%)`;
  }

  function renderLog(data) {
    logBody.innerHTML = '';
    if (!data) {
      logEmpty.style.display = 'block';
      return;
    }
    logEmpty.style.display = 'none';
    const items = Object.values(data).sort((a, b) => (b.ts || 0) - (a.ts || 0));
    for (const item of items) {
      const tr = document.createElement('tr');
      const date = item.ts ? new Date(item.ts).toLocaleString('ja-JP') : '不明';
      const clicksHtml = item.clicks
        ? Object.values(item.clicks)
            .sort((a, b) => (a.ts || 0) - (b.ts || 0))
            .map((c) => `<span class="click-item">${escapeHtml(c.label || c.href || '')}</span>`)
            .join('')
        : '<span class="click-item">（なし）</span>';
      const fp = item.fp || '';
      const fpBadge = fp
        ? `<span class="fp" style="background:${fpColor(fp)}">${escapeHtml(fp)}</span>`
        : '<span class="fp">—</span>';
      const gpu = item.gpu || '';
      const scr = item.screen ? `${escapeHtml(item.screen)}${item.dpr && item.dpr !== 1 ? ' @' + escapeHtml(String(item.dpr)) : ''}` : '—';
      tr.innerHTML = `
        <td>${escapeHtml(date)}</td>
        <td>${fpBadge}</td>
        <td>${escapeHtml(parseUA(item.ua))}</td>
        <td class="gpu">${escapeHtml(gpu || '—')}</td>
        <td>${scr}</td>
        <td>${escapeHtml(item.tz || '—')}</td>
        <td>${escapeHtml(formatGeo(item))}</td>
        <td>${escapeHtml(item.ip || '不明')}</td>
        <td>${escapeHtml(item.referrer || '(direct)')}</td>
        <td class="clicks">${clicksHtml}</td>
        <td class="visitor">${escapeHtml((item.visitorId || '').slice(0, 8))}</td>
      `;
      logBody.appendChild(tr);
    }
  }

  onAuthStateChanged(auth, (user) => {
    if (user && user.email === ADMIN_EMAIL) {
      loginCard.style.display = 'none';
      logCard.style.display = 'block';
      onValue(ref(db, 'pageviews'), (snapshot) => renderLog(snapshot.val()));
    } else if (user) {
      loginCard.style.display = 'block';
      logCard.style.display = 'none';
      loginMsg.textContent = `このアカウント（${user.email}）には閲覧権限がありません。`;
      loginMsg.style.display = 'block';
    } else {
      loginCard.style.display = 'block';
      logCard.style.display = 'none';
      loginMsg.style.display = 'none';
    }
  });
</script>
</body>
</html>
